# One-off check that the release-key secrets are in place and open the key, without
# printing anything secret. Removed in the commit that retires the temporary key.
name: Verify release key

on:
  push:
    paths:
      - .github/workflows/verify-release-key.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: The four secrets exist
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for n in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!n}" ]; then echo "::error::$n is missing"; missing=1; else echo "$n: set"; fi
          done
          exit $missing

      - name: Keystore decodes and opens with the store password and alias
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "Alias: $KEY_ALIAS"
          keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" \
            | grep -E '^(Alias name|Entry type|Owner|Issuer|Valid from|Signature algorithm name|Subject Public Key Algorithm|[[:space:]]*SHA256:)'

      - name: Gradle signs the release APK with it
        run: ./gradlew :app:assembleRelease
        env:
          ORG_GRADLE_PROJECT_PASSO_KEYSTORE: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_PASSO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_PASSO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_PASSO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: The APK carries the release certificate
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -E '^(Verified using|Signer #1 certificate (DN|SHA-256))'
