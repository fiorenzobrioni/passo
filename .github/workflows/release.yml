name: Release

# Fires only on version tags (v0.1.0, v1.0.0, v1.1.0-rc1, ...). Builds the minified APK signed
# with the REAL release key (GitHub Secrets) and publishes it, with its SHA-256 checksum and
# the R8 mapping, as a GitHub Release (PLANNING.md §11 Phase 8). Per-push testing builds stay
# in android-ci.yml. keystore/README.md says what the four secrets hold.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    name: Signed release build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The tag must name the version the APK carries: bump passo.versionName in
      # gradle.properties first, then tag v<that>.
      - name: Tag matches the app version
        run: |
          version=$(sed -n 's/^passo\.versionName=//p' gradle.properties)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match passo.versionName=${version} in gradle.properties."
            exit 1
          fi

      # Same gate as CI: a red suite, or a forbidden permission, must never become a release.
      - name: Formatting, permissions, tests, lint
        run: ./gradlew spotlessCheck :app:checkForbiddenPermissions test :app:lintDebug

      # A missing secret fails here, by name, rather than as an unsigned APK further down.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The ${name} secret is missing (keystore/README.md)."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Gradle picks up ORG_GRADLE_PROJECT_<name> env vars as project properties: the same
      # names the signingConfig reads locally, and nothing secret on the command line.
      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease
        env:
          ORG_GRADLE_PROJECT_PASSO_KEYSTORE: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_PASSO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_PASSO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_PASSO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Named after the tag: the mapping must stay paired with the exact APK it deobfuscates,
      # and the checksum lets a reader verify the download (README, "Installing and verifying").
      - name: Rename artifacts after the tag, write the checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk "passo-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "mapping-${GITHUB_REF_NAME}.txt"
          sha256sum "passo-${GITHUB_REF_NAME}.apk" > "passo-${GITHUB_REF_NAME}.apk.sha256"

      # The body is the CHANGELOG section for this tag, so the page says what changed in the
      # reader's terms; GitHub's generated notes are appended under it. Matched as a literal
      # prefix, not a regex, or the dots in the version would match anything. A missing
      # section falls back to the generated notes rather than failing the release.
      - name: Take the release body from CHANGELOG.md
        run: |
          : > release-notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v pfx="## [${GITHUB_REF_NAME#v}]" '
              index($0, pfx) == 1        { found = 1; next }
              found && index($0, "## [") == 1 { exit }
              found && /^\[[^]]+\]: /         { exit }
              found                      { print }
            ' CHANGELOG.md >> release-notes.md
          fi
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::warning::No CHANGELOG.md section for ${GITHUB_REF_NAME}; using the generated notes alone."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            passo-${{ github.ref_name }}.apk
            passo-${{ github.ref_name }}.apk.sha256
            mapping-${{ github.ref_name }}.txt
          generate_release_notes: true
          # A hyphen in the tag (v1.0.0-rc1) is a pre-release by SemVer definition.
          prerelease: ${{ contains(github.ref_name, '-') }}
